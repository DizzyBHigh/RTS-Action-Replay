<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RTS Action Replay WebSocket Test</title>
  <style>
    body{margin:0;background:transparent;color:#fff;font:16px system-ui,sans-serif}
    #status{padding:12px;border:2px solid #444;border-radius:8px;background:#111c}
    #status.connected{border-color:#0384cb}
    #status.error{border-color:#d44}
    #video{display:none;width:100%;max-height:80vh;background:#000}
  </style>
</head>
<body>
  <div id="status">Connecting to Streamer.bot…</div>
  <video id="video" controls playsinline></video>
  <script>
    const status = document.getElementById('status');
    const video = document.getElementById('video');
    const host = '127.0.0.1';
    const port = 8080;
    let reconnectTimer;

    function setStatus(text, state = '') {
      status.textContent = text;
      status.className = state;
    }

    function connect() {
      clearTimeout(reconnectTimer);
      setStatus(`Connecting to Streamer.bot at ws://${host}:${port}/…`);

      const ws = new WebSocket(`ws://${host}:${port}/`);

      ws.onopen = () => {
        setStatus('Connected to Streamer.bot WebSocket', 'connected');
        ws.send(JSON.stringify({
          request: 'Subscribe',
          id: 'rts-action-replay-poc',
          events: { General: ['Custom'] }
        }));
      };

      ws.onmessage = event => {
        try {
          const message = JSON.parse(event.data);
          console.log('Streamer.bot message', message);
        } catch (error) {
          console.warn('Invalid WebSocket message', error);
        }
      };

      ws.onerror = () => {
        setStatus('Streamer.bot WebSocket connection error', 'error');
      };

      ws.onclose = event => {
        setStatus(`Streamer.bot WebSocket closed (code ${event.code})`, 'error');
        reconnectTimer = setTimeout(connect, 3000);
      };

      window.ws = ws;
    }

    window.testReplay = url => {
      status.textContent = `Loading replay: ${url}`;
      status.className = '';
      video.src = url;
      video.style.display = 'block';
      video.load();
    };

    connect();
    console.log('RTS Action Replay POC loaded. Use testReplay("http://127.0.0.1:7474/...") to test local video playback.');
  </script>
</body>
</html>
