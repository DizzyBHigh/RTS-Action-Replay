<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RTS Action Replay</title>
  <link rel="stylesheet" href="overlay-base.css?v=20260910-3">
  <link rel="stylesheet" href="player.css?v=20260912-1">
  <link rel="stylesheet" href="youtube-player.css?v=20260915-1">
  <link rel="stylesheet" href="player-elements.css?v=20260911-8">
  <link rel="stylesheet" href="broadcast-chevron-animation.css?v=20260911-8">
  <link rel="stylesheet" href="dev-toolbar.css?v=20260917-5">
  <link rel="stylesheet" href="player-controls-layout.css?v=20260914-1">
  <link rel="stylesheet" href="information-panel-positioning.css?v=20260912-3">
  <link rel="stylesheet" href="recent-list.css?v=20260914-1">
  <link rel="stylesheet" href="search-panel.css?v=20260916-11">
  <link rel="stylesheet" href="search-panel-broadcast-chevron.css?v=20260916-4">
  <link rel="stylesheet" href="search-panel-cut.css?v=20260916-1">
  <link rel="stylesheet" href="playlist-list.css?v=20260914-1">
  <link rel="stylesheet" href="leaderboard-list.css?v=20260916-1">
  <link rel="stylesheet" href="information-panel-presets.css?v=20260916-9">
  <link rel="stylesheet" href="position-preview.css?v=20260913-3">
  <link rel="stylesheet" href="clapper.css?v=af6faac7">
  <link rel="stylesheet" href="clapper-content.css">
  <link rel="stylesheet" href="clapper-animation.css">
  <link rel="stylesheet" href="clapper-responsive.css">
</head>
<body>
  <div id="rts-overlay">
    <div id="status" aria-hidden="true">Connecting to Streamer.bot…</div>
    <div id="replay-player-stage">
      <div id="replay-player" aria-hidden="true">
        <div id="player-frame" class="border-solid">
          <video id="video" playsinline></video>
          <div id="youtube-player-host" aria-hidden="true"></div>
          <div id="player-elements" aria-hidden="true">
            <div id="player-branding"><img id="player-brand-logo" alt=""><b id="player-brand-fallback">RTS</b><span id="player-brand-label">ACTION REPLAY</span></div>
            <span id="player-speed">1×</span><div id="player-title"></div>
          </div>
          <div id="player-controls" aria-hidden="true"><span id="player-current">00:00</span><div id="player-progress"><div id="player-progress-bar"></div></div><span id="player-duration">00:00</span></div>
        </div>
      </div>
    </div>
    <div id="recent-list" aria-hidden="true"><div id="recent-list-title">RECENT REPLAYS</div></div>
    <div id="search-panel" data-rts-information-panel="search" aria-hidden="true"></div>
    <div id="playlist-list" data-rts-information-panel="playlist" aria-hidden="true"></div>
    <div id="leaderboard-list" data-rts-information-panel="creatorLeaderboard" aria-hidden="true"></div>
    <div id="message-card" aria-hidden="true"><div class="clapper"><div class="clapstick"><span></span><span></span><span></span><span></span></div><div class="hinge"><i></i><i></i></div><div class="slate"><div class="brand"><img id="brand-logo" alt=""><div id="brand-fallback">RTS</div><small>ACTION REPLAY</small></div><div class="message-content"><div class="message-kicker">RTS ACTION REPLAY</div><div id="message-text"></div></div><div class="slate-fields"><div><span>LENGTH</span><b id="clapper-length">—</b></div><div><span>DIRECTOR</span><b id="clapper-director">—</b></div><div><span>PLAYED</span><b id="clapper-played">—</b></div></div></div></div></div>
  </div>
  <script src="replay-config.js?v=20260912-2"></script>
  <script src="player-positions.js?v=20260913-1"></script>
  <script src="animation-engine.js"></script>
  <script src="animation-profiles.js"></script>
  <script src="player-3d-positioning.js?v=20260917-1"></script>
  <script src="player-controls.js?v=20260915-1"></script>
  <script src="player-elements.js?v=20260911-8"></script>
  <script src="clapper-positioning.js?v=20260917-1"></script>
  <script src="clapper-animation.js"></script>
  <script src="replay-messages.js?v=20260916-1"></script>
  <script src="information-panel-positioning.js?v=20260917-1"></script>
  <script src="information-panel-animation.js?v=20260913-4"></script>
  <script src="information-panel-presets.js?v=20260916-1"></script>
  <script src="broadcast-panel-chevron-animation.js?v=20260916-10"></script>
  <script src="recent-list.js?v=20260912-7"></script>
  <script src="search-panel.js?v=20260916-9"></script>
  <script src="playlist-list.js?v=20260914-1"></script>
  <script src="leaderboard-list.js?v=20260916-1"></script>
  <script src="cut-title-animation.js?v=20260911-1"></script>
  <script src="broadcast-chevron-animation.js?v=20260911-8"></script>
  <script src="replay-video.js?v=20260915-4"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="position-preview.js?v=20260913-3"></script>
  <script src="dev-toolbar.js?v=20260916-3"></script>
  <script src="dev-viewport.js?v=20260917-1"></script>
  <script src="dev-log.js?v=20260914-3"></script>
  <script src="settings-sync.js?v=20260917-1"></script>
  <script src="replay-websocket.js?v=20260916-2"></script>
  <script src="overlay.js?v=20260916-5"></script>
</body>
</html>
