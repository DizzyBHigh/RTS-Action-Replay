<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RTS Action Replay</title>
  <link rel="stylesheet" href="overlay-base.css">
  <link rel="stylesheet" href="player.css">
  <link rel="stylesheet" href="youtube-player.css">
  <link rel="stylesheet" href="player-elements.css">
  <link rel="stylesheet" href="broadcast-chevron-animation.css">
  <link rel="stylesheet" href="dev-toolbar.css">
  <link rel="stylesheet" href="dev-harness.css">
  <link rel="stylesheet" href="player-controls-layout.css">
  <link rel="stylesheet" href="information-panel-positioning.css">
  <link rel="stylesheet" href="search-panel.css">
  <link rel="stylesheet" href="search-panel-cut.css">
  <link rel="stylesheet" href="information-panel-presets.css">
  <link rel="stylesheet" href="search-panel-broadcast-chevron.css">
  <link rel="stylesheet" href="position-preview.css">
  <link rel="stylesheet" href="clapper.css">
  <link rel="stylesheet" href="clapper-content.css">
  <link rel="stylesheet" href="clapper-animation.css">
  <link rel="stylesheet" href="clapper-responsive.css">
  <link rel="stylesheet" href="message-panel.css">
</head>
<body>
  <div id="rts-overlay">
    <div id="status" aria-hidden="true">Connecting to Streamer.bot…</div>
    <div id="replay-player" aria-hidden="true">
        <div id="player-frame" class="border-solid">
          <video id="video" playsinline></video>
          <div id="youtube-player-host" aria-hidden="true"></div>
          <div id="player-elements" aria-hidden="true">
            <div id="player-branding"><img id="player-brand-logo" alt=""><b id="player-brand-fallback">RTS</b><span id="player-brand-label">ACTION REPLAY</span></div>
            <span id="player-speed">1×</span><div id="player-title"></div>
          </div>
          <div id="player-controls" aria-hidden="true"><button id="player-play-pause" type="button" aria-label="Play" aria-pressed="false"><span aria-hidden="true">▶</span></button><span id="player-current">00:00</span><div id="player-progress" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" tabindex="0"><div id="player-progress-bar"></div></div><span id="player-duration">00:00</span></div>
        </div>
    </div>
    <div id="recent-list" aria-hidden="true"></div>
    <div id="search-panel" data-rts-information-panel="search" aria-hidden="true"></div>
    <div id="playlist-list" data-rts-information-panel="playlist" aria-hidden="true"></div>
    <div id="leaderboard-list" data-rts-information-panel="creatorLeaderboard" aria-hidden="true"></div>
    <div id="message-card" data-rts-information-panel="message" aria-hidden="true"><div class="rts-panel-header rts-message-header"><span class="rts-message-brand"><img id="message-brand-logo" alt=""><b id="message-brand-fallback">RTS</b><small id="message-brand-label">ACTION REPLAY</small></span><strong id="message-text"></strong></div></div>
    <div id="clapper-card" aria-hidden="true"><div class="clapper-position"><div class="clapper"><div class="clapstick"><span></span><span></span><span></span><span></span></div><div class="hinge"><i></i><i></i></div><div class="slate"><div class="brand"><img id="brand-logo" alt=""><div id="brand-fallback">RTS</div><small>ACTION REPLAY</small></div><div class="message-content"><div class="message-kicker">RTS ACTION REPLAY</div><div id="clapper-message-text"></div></div><div class="slate-fields"><div><span>LENGTH</span><b id="clapper-length">—</b></div><div><span>CREATOR</span><b id="clapper-director">—</b></div><div><span>PLAYED</span><b id="clapper-played">—</b></div></div></div></div></div></div>
  </div>
  <script src="replay-config.js"></script>
  <script src="positioning-engine.js"></script>
  <script src="animation-engine.js"></script>
  <script src="player-controls.js"></script>
  <script src="player-elements.js"></script>
  <script src="replay-messages.js"></script>
  <script src="information-panel-positioning.js"></script>
  <script src="information-panel-animation.js"></script>
  <script src="information-panel-presets.js"></script>
  <script src="broadcast-panel-chevron-animation.js"></script>
  <script src="recent-list.js"></script>
  <script src="search-panel.js"></script>
  <script src="playlist-list.js"></script>
  <script src="leaderboard-list.js"></script>
  <script src="cut-title-animation.js"></script>
  <script src="broadcast-chevron-animation.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js"></script>
  <script src="replay-video.js"></script>
  <script src="replay-watchdog.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="position-preview.js"></script>
  <script src="dev-toolbar.js"></script>
  <script src="dev-harness.js"></script>
  <script src="dev-viewport.js"></script>
  <script src="dev-log.js"></script>
  <script src="replay-websocket.js"></script>
  <script src="config-sync-presentation.js"></script>
  <script src="config-sync.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
