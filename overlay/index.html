<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RTS Action Replay</title>
  <link rel="stylesheet" href="overlay-base.css">
  <link rel="stylesheet" href="clapper.css">
  <link rel="stylesheet" href="clapper-content.css">
  <link rel="stylesheet" href="clapper-animation.css">
  <link rel="stylesheet" href="clapper-responsive.css">
</head>
<body>
  <div id="rts-overlay">
    <div id="status" aria-hidden="true">Connecting to Streamer.bot…</div>
    <div id="message-card" aria-hidden="true">
      <div class="clapper">
        <div class="clapstick" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="hinge" aria-hidden="true"><i></i><i></i></div>
        <div class="slate">
          <div class="brand">
            <img id="brand-logo" alt="">
            <div id="brand-fallback">RTS</div>
            <small>ACTION REPLAY</small>
          </div>
          <div class="message-content">
            <div class="message-kicker">RTS ACTION REPLAY</div>
            <div id="message-text"></div>
          </div>
          <div class="slate-fields" aria-hidden="true">
            <div><span>SCENE</span><b>01</b></div>
            <div><span>TAKE</span><b>01</b></div>
            <div><span>ROLL</span><b>∞</b></div>
          </div>
        </div>
      </div>
    </div>
    <video id="video" controls playsinline></video>
  </div>
  <script src="replay-config.js"></script>
  <script src="replay-messages.js"></script>
  <script src="replay-video.js"></script>
  <script src="replay-websocket.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
