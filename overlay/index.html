<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RTS Action Replay</title>
  <link rel="stylesheet" href="overlay-base.css?v=20260910-3">
  <link rel="stylesheet" href="player.css?v=20260912-1">
  <link rel="stylesheet" href="player-elements.css?v=20260911-8">
  <link rel="stylesheet" href="broadcast-chevron-animation.css?v=20260911-8">
  <link rel="stylesheet" href="dev-toolbar.css?v=20260912-1">
  <link rel="stylesheet" href="recent-list.css?v=20260912-1">
  <link rel="stylesheet" href="clapper.css?v=af6faac7">
  <link rel="stylesheet" href="clapper-content.css">
  <link rel="stylesheet" href="clapper-animation.css">
  <link rel="stylesheet" href="clapper-responsive.css">
</head>
<body>
  <div id="rts-overlay">
    <div id="status" aria-hidden="true">Connecting to Streamer.bot…</div>
    <div id="replay-player-stage">
      <div id="replay-player" aria-hidden="true">
        <div id="player-frame" class="border-solid">
          <video id="video" playsinline></video>
          <div id="player-elements" aria-hidden="true">
            <div id="player-branding"><img id="player-brand-logo" alt=""><b id="player-brand-fallback">RTS</b><span id="player-brand-label">ACTION REPLAY</span></div>
            <span id="player-speed">1×</span><div id="player-title"></div>
          </div>
          <div id="player-controls" aria-hidden="true"><span id="player-current">00:00</span><div id="player-progress" aria-hidden="true"><div id="player-progress-bar"></div></div><span id="player-duration">00:00</span></div>
        </div>
      </div>
    </div>
    <div id="recent-list" aria-hidden="true"><div id="recent-list-title">RECENT REPLAYS</div></div>
    <div id="message-card" aria-hidden="true"><div class="clapper"><div class="clapstick"><span></span><span></span><span></span><span></span></div><div class="hinge"><i></i><i></i></div><div class="slate"><div class="brand"><img id="brand-logo" alt=""><div id="brand-fallback">RTS</div><small>ACTION REPLAY</small></div><div class="message-content"><div class="message-kicker">RTS ACTION REPLAY</div><div id="message-text"></div></div><div class="slate-fields"><div><span>LENGTH</span><b id="clapper-length">—</b></div><div><span>DIRECTOR</span><b id="clapper-director">—</b></div><div><span>PLAYED</span><b id="clapper-played">—</b></div></div></div></div></div>
  </div>
  <script src="replay-config.js?v=20260912-1"></script>
  <script src="player-positions.js?v=20260910-7"></script>
  <script src="animation-profiles.js"></script>
  <script src="player-3d-positioning.js?v=20260910-1"></script>
  <script src="player-controls.js?v=20260912-1"></script>
  <script src="player-elements.js?v=20260911-8"></script>
  <script src="replay-messages.js?v=20260910-3"></script>
  <script src="recent-list.js?v=20260912-1"></script>
  <script src="cut-title-animation.js?v=20260911-1"></script>
  <script src="broadcast-chevron-animation.js?v=20260911-8"></script>
  <script src="replay-video.js?v=20260912-2"></script>
  <script src="dev-toolbar.js?v=20260912-1"></script>
  <script src="dev-log.js?v=20260912-1"></script>
  <script src="replay-websocket.js?v=20260910-3"></script>
  <script src="overlay.js?v=20260912-2"></script>
</body>
</html>
