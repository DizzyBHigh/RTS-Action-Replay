name: Apply animation profile UI
on:
  push:
    branches:
      - feature/playlist
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Apply animation profile UI') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/playlist
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/patch-profile-ui.py
      - name: Commit patch and remove helper files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamerbot/RTSActionReplaySettings.cs
          git rm tools/patch-profile-ui.py .github/workflows/_apply-profile-ui.yml
          git commit -m "Apply animation profile UI"
          git push origin feature/playlist
