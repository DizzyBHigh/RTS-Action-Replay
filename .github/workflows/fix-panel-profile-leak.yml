name: Fix panel profile leak

on:
  push:
    paths:
      - .github/workflows/fix-panel-profile-leak.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/json-conversion
          fetch-depth: 0
      - name: Remove player profiles from panel configuration
        shell: python
        run: |
          from pathlib import Path
          p = Path('streamerbot/RTSActionReplayAnimationProfiles.cs')
          s = p.read_text(encoding='utf-8')
          old = '''        var panel = ReadConfig(PanelKey, CreatePanelDefaults());
        NormalizePositionConfig(panel, true);
        panel["animationProfiles"] = NormalizeProfiles(panel["animationProfiles"] as JArray);
        NormalizeSequences(panel, true);'''
          new = '''        var panel = ReadConfig(PanelKey, CreatePanelDefaults());
        NormalizePositionConfig(panel, true);
        panel["animationProfiles"] = NormalizeProfiles(panel["animationProfiles"] as JArray);
        RemovePlayerProfilesFromPanel(panel["animationProfiles"] as JArray, (JArray)player["animationProfiles"]);
        NormalizeSequences(panel, true);'''
          if old not in s:
              raise SystemExit('Expected panel normalization block was not found')
          s = s.replace(old, new, 1)
          marker = '''    private void NormalizePositionConfig(JObject config, bool panel)
'''
          helper = '''    private void RemovePlayerProfilesFromPanel(JArray panelProfiles, JArray playerProfiles)
    {
        if (panelProfiles == null || playerProfiles == null) return;
        for (var i = panelProfiles.Count - 1; i >= 0; i--)
        {
            var id = (string)panelProfiles[i]["id"];
            if (string.IsNullOrWhiteSpace(id) || id == "default") continue;
            if (FindProfile(playerProfiles, id) != null) panelProfiles.RemoveAt(i);
        }
    }

'''
          if marker not in s:
              raise SystemExit('Expected normalization marker was not found')
          p.write_text(s.replace(marker, helper + marker, 1), encoding='utf-8')
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamerbot/RTSActionReplayAnimationProfiles.cs
          git commit -m "Fix panel profile separation"
          git rm .github/workflows/fix-panel-profile-leak.yml
          git commit -m "Remove temporary panel profile workflow"
          git push origin HEAD:feature/json-conversion
