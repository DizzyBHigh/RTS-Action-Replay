name: Temporary Player Position JSON Patch

on:
  push:
    branches:
      - feature/json-conversion

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch settings
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('streamerbot/RTSActionReplaySettings.cs')
          text = path.read_text(encoding='utf-8')

          old = '''    private void AddPositionSettings(RtsUI ui)\n    {\n        ui.BeginSection("Saved Positions", "Positions");\n        ui.BeginRow(3, 2);\n        ui.AddPositionEditor("Saved Positions", "Create and edit reusable player positions. Full Screen is built in and cannot be deleted.", "Positions", "rts.actionreplay.positions", "{\\"Full Screen\\":{\\"name\\":\\"Full Screen\\",\\"tag\\":\\"full-screen\\",\\"scale\\":100,\\"x\\":0,\\"y\\":0,\\"rotateX\\":0,\\"rotateY\\":0,\\"rotateZ\\":0}}", "Edit Positions", "Preview Position", null, "scale,x,y,rotateX,rotateY,rotateZ", null, delegate(string position, string json) { PreviewVideoPosition(position, json); }, null);\n        ui.AddList("Position Tags", "", "Positions", BuildPositionTagList(CPH.GetGlobalVar<string>("rts.actionreplay.positions", true)));\n'''

          new = '''    private void AddPositionSettings(RtsUI ui)\n    {\n        SyncPlayerPositionEditorBridge();\n        ui.BeginSection("Saved Positions", "Positions");\n        ui.BeginRow(3, 2);\n        ui.AddPositionEditor("Saved Positions", "Create and edit reusable player positions. Full Screen is built in and cannot be deleted.", "Positions", "rts.actionreplay.ui.playerPositions", "{\\"Full Screen\\":{\\"name\\":\\"Full Screen\\",\\"tag\\":\\"full-screen\\",\\"scale\\":100,\\"x\\":0,\\"y\\":0,\\"rotateX\\":0,\\"rotateY\\":0,\\"rotateZ\\":0}}", "Edit Positions", "Preview Position", null, "scale,x,y,rotateX,rotateY,rotateZ", SavePlayerPositionsFromEditor, delegate(string position, string json) { PreviewVideoPosition(position, json); }, null);\n        ui.AddList("Position Tags", "", "Positions", BuildPositionTagList(CPH.GetGlobalVar<string>("rts.actionreplay.ui.playerPositions", true)));\n'''

          if old not in text:
              raise SystemExit('Expected AddPositionSettings player block was not found')
          text = text.replace(old, new, 1)

          old = '''    private void PreviewVideoPosition(string position, string json)\n'''
          new = '''    private void SyncPlayerPositionEditorBridge()\n    {\n        CPH.ExecuteMethod("RTS Action Replay Store", "GetPlayerPositions");\n        var positions = CPH.GetGlobalVar<string>("rts.actionreplay.positions", true) ?? "{}";\n        string replayPositions;\n        if (CPH.TryGetArg("replayPositions", out replayPositions) && !string.IsNullOrWhiteSpace(replayPositions)) positions = replayPositions;\n        CPH.SetGlobalVar("rts.actionreplay.ui.playerPositions", positions, true);\n    }\n\n    private void SavePlayerPositionsFromEditor(string json)\n    {\n        if (string.IsNullOrWhiteSpace(json)) return;\n        CPH.SetGlobalVar("rts.actionreplay.ui.playerPositions", json, true);\n        CPH.SetArgument("replayPositions", json);\n        CPH.ExecuteMethod("RTS Action Replay Store", "SavePlayerPositions");\n    }\n\n    private void PreviewVideoPosition(string position, string json)\n'''

          if old not in text:
              raise SystemExit('Expected PreviewVideoPosition marker was not found')
          text = text.replace(old, new, 1)

          old = '''        var positions = ParsePositions(CPH.GetGlobalVar<string>("rts.actionreplay.positions", true));\n'''
          new = '''        var positions = ParsePositions(CPH.GetGlobalVar<string>("rts.actionreplay.ui.playerPositions", true));\n'''
          if old not in text:
              raise SystemExit('Expected animation position source was not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          print('Patched player position editor JSON bridge')
          PY

      - name: Verify patch
        run: |
          grep -q 'rts.actionreplay.ui.playerPositions' streamerbot/RTSActionReplaySettings.cs
          grep -q 'SavePlayerPositionsFromEditor' streamerbot/RTSActionReplaySettings.cs
          grep -q 'RTS Action Replay Store' streamerbot/RTSActionReplaySettings.cs

      - name: Commit settings change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add streamerbot/RTSActionReplaySettings.cs
          git commit -m 'Connect player position editor to JSON config'
          git push

      - name: Remove temporary workflow
        run: |
          rm .github/workflows/json-position-editor-patch.yml
          git add .github/workflows/json-position-editor-patch.yml
          git commit -m 'Remove temporary JSON position patch workflow'
          git push
