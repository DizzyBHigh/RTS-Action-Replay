name: Fix Default Profile Order

on:
  push:
    branches:
      - feature/json-conversion

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix animation Default profile ordering'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix NormalizeProfiles
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('streamerbot/RTSActionReplayAnimationProfiles.cs')
          s = p.read_text(encoding='utf-8')
          pattern = r'    private JArray NormalizeProfiles\(JArray source\)\n    \{.*?\n    \}\n\n    private JObject NormalizeEntryPoints'
          replacement = '''    private JArray NormalizeProfiles(JArray source)
    {
        var result = new JArray(); var defaultProfile = (JObject)null;
        foreach (var token in source ?? new JArray())
        {
            var id = (string)token["id"];
            if (string.IsNullOrWhiteSpace(id) || FindProfile(result, id) != null) continue;
            var item = new JObject { ["id"] = id, ["name"] = id == "default" ? "Default" : (string)token["name"] ?? "New Profile", ["startSequence"] = token["startSequence"] as JArray ?? new JArray(), ["endSequence"] = token["endSequence"] as JArray ?? new JArray() };
            if (id == "default") defaultProfile = item; else result.Add(item);
        }
        result.Insert(0, defaultProfile ?? CreateProfile("default", "Default", true));
        return result;
    }

    private JObject NormalizeEntryPoints'''
          s2, n = re.subn(pattern, replacement, s, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected exactly one NormalizeProfiles block, found {n}')
          p.write_text(s2, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamerbot/RTSActionReplayAnimationProfiles.cs
          git commit -m "Fix animation Default profile ordering"
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-default-order.yml
          git commit -m "Remove temporary profile-order workflow"
          git push
