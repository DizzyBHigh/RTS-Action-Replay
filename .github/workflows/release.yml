name: Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or commit to package'
        required: true
        default: 'main'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare release files
        shell: bash
        run: |
          REF="${{ github.event.inputs.ref || github.ref_name }}"
          git checkout "$REF"
          VERSION="${REF#v}"
          NAME=$(python - <<'PY'
          import json
          with open('site/rts.json', encoding='utf-8') as f:
              data = json.load(f)
          print(data['name'])
          PY
          )
          IMPORT_SOURCE="$(python - <<'PY'
          import json
          with open('site/rts.json', encoding='utf-8') as f:
              data = json.load(f)
          print(data.get('publish', {}).get('importFile', 'RTS Extension - Import Code.txt'))
          PY
          )"
          IMPORT_NAME="${NAME} v${VERSION} - Import Code.txt"
          test -f "${IMPORT_SOURCE}"
          mkdir -p dist
          cp "${IMPORT_SOURCE}" "dist/${IMPORT_NAME}"

          OVERLAY_NAME="${NAME} v${VERSION} - Overlay.zip"
          test -d overlay
          zip -r "dist/${OVERLAY_NAME}" overlay

          echo "IMPORT_PATH=dist/${IMPORT_NAME}" >> "$GITHUB_ENV"
          echo "OVERLAY_PATH=dist/${OVERLAY_NAME}" >> "$GITHUB_ENV"

      - name: Check placeholder was replaced
        shell: bash
        run: |
          if grep -q "RTS EXTENSION IMPORT CODE PLACEHOLDER" "$IMPORT_PATH"; then
            echo "The Streamer.bot import code is still the template placeholder."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Assets prepared for ${REF}. Upload these files to the existing release manually."
          else
            gh release create "${GITHUB_REF_NAME}" \
              "$IMPORT_PATH" \
              "$OVERLAY_PATH" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
