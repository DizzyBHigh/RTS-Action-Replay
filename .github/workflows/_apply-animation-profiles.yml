name: Apply source-specific animation profiles

on:
  push:
    branches:
      - catalog/twitch-integration

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'Apply source-specific animation profiles [skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}

      - name: Patch animation profiles
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python3 <<'PY'
          from pathlib import Path

          ROOT = Path('.')

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path, text):
              (ROOT / path).write_text(text, encoding='utf-8', newline='')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          # Settings UI: replace the old global animation controls with five source profiles.
          path = 'streamerbot/RTSActionReplaySettings.cs'
          text = read(path)
          text = replace_once(text, '        AddAnimationSettings(ui);', '        EnsureAnimationProfiles();\n        AddAnimationProfileSettings(ui);', 'settings Execute animation call')

          old_positions = '''    private void AddPositionSettings(RtsUI ui)\n    {\n        ui.BeginSection("Default Positions", "Positions");\n        ui.BeginRow();\n        ui.AddPositionSelector("Default Start Position", "Position used when the player starts showing.", "Positions", "rts.actionreplay.defaultStartPosition", "rts.actionreplay.positions", "Full Screen");\n        ui.AddPositionSelector("Default End Position", "Position used when the player has finished showing.", "Positions", "rts.actionreplay.defaultEndPosition", "rts.actionreplay.positions", "Full Screen");\n        ui.EndRow();\n        ui.EndSection();\n        ui.BeginSection("Saved Positions", "Positions");\n        ui.AddPositionEditor("Saved Positions", "Create and edit reusable player positions. Full Screen is built in and cannot be deleted.", "Positions", "rts.actionreplay.positions", "{\\"Full Screen\\":{\\"name\\":\\"Full Screen\\",\\"tag\\":\\"full-screen\\",\\"scale\\":100,\\"x\\":0,\\"y\\":0,\\"rotateX\\":0,\\"rotateY\\":0,\\"rotateZ\\":0}}", null, PreviewPosition);\n        ui.AddTitle(BuildPositionTagList(CPH.GetGlobalVar<string>("rts.actionreplay.positions", true)), "Positions");\n        ui.EndSection();\n    }\n\n    private void AddAnimationSettings(RtsUI ui)\n    {\n        ui.BeginSection("Player Animation", "Animation");\n        ui.BeginRow();\n        ui.AddNumericTextbox("Animation Duration", "Duration used when moving between the Start and End positions, in milliseconds.", "Animation", "rts.actionreplay.animationDuration", 0, 100, 20000);\n        ui.AddDropdown("Animation Easing", "CSS easing used for player movement.", "Animation", "rts.actionreplay.animationEasing", new[] { "linear", "ease", "ease-in", "ease-out", "ease-in-out" }, "ease-in-out");\n        ui.EndRow();\n        ui.EndSection();\n    }\n'''

          new_positions = '''    private void AddPositionSettings(RtsUI ui)\n    {\n        ui.BeginSection("Saved Positions", "Positions");\n        ui.AddPositionEditor("Saved Positions", "Create and edit reusable player positions. Full Screen is built in and cannot be deleted.", "Positions", "rts.actionreplay.positions", "{\\"Full Screen\\":{\\"name\\":\\"Full Screen\\",\\"tag\\":\\"full-screen\\",\\"scale\\":100,\\"x\\":0,\\"y\\":0,\\"rotateX\\":0,\\"rotateY\\":0,\\"rotateZ\\":0}}", null, PreviewPosition);\n        ui.AddTitle(BuildPositionTagList(CPH.GetGlobalVar<string>("rts.actionreplay.positions", true)), "Positions");\n        ui.EndSection();\n    }\n\n    private void AddAnimationProfileSettings(RtsUI ui)\n    {\n        ui.BeginSection("Animation Profiles", "Player");\n        AddAnimationProfile(ui, "Default", "default");\n        AddAnimationProfile(ui, "Twitch Clip", "twitchClip");\n        AddAnimationProfile(ui, "OBS Clip", "obsClip");\n        AddAnimationProfile(ui, "Playlist", "playlist");\n        AddAnimationProfile(ui, "Recent", "recent");\n        ui.EndSection();\n    }\n\n    private void AddAnimationProfile(RtsUI ui, string name, string slug)\n    {\n        ui.BeginSection(name);\n        ui.BeginRow();\n        ui.AddPositionSelector("Start Position", "Position used when this source starts showing.", "Player", "rts.actionreplay.animation." + slug + ".startPosition", "rts.actionreplay.positions", "Full Screen");\n        ui.AddPositionSelector("End Position", "Position reached when this source finishes showing.", "Player", "rts.actionreplay.animation." + slug + ".endPosition", "rts.actionreplay.positions", "Full Screen");\n        ui.EndRow();\n        ui.BeginRow();\n        ui.AddNumericTextbox("Duration", "Duration of the movement between Start Position and End Position, in milliseconds.", "Player", "rts.actionreplay.animation." + slug + ".duration", 500, 100, 20000);\n        ui.AddDropdown("Easing", "CSS easing used for this source's player movement.", "Player", "rts.actionreplay.animation." + slug + ".easing", new[] { "linear", "ease", "ease-in", "ease-out", "ease-in-out" }, "ease-in-out");\n        ui.EndRow();\n        ui.EndSection();\n    }\n\n    private void EnsureAnimationProfiles()\n    {\n        var start = CPH.GetGlobalVar<string>("rts.actionreplay.defaultStartPosition", true) ?? "Full Screen";\n        var end = CPH.GetGlobalVar<string>("rts.actionreplay.defaultEndPosition", true) ?? "Full Screen";\n        var duration = GetSettingDouble("rts.actionreplay.animationDuration", 500);\n        var easing = CPH.GetGlobalVar<string>("rts.actionreplay.animationEasing", true) ?? "ease-in-out";\n        var profiles = new[] { "default", "twitchClip", "obsClip", "playlist", "recent" };\n        foreach (var slug in profiles)\n        {\n            SetIfMissing("rts.actionreplay.animation." + slug + ".startPosition", start);\n            SetIfMissing("rts.actionreplay.animation." + slug + ".endPosition", end);\n            SetIfMissing("rts.actionreplay.animation." + slug + ".duration", duration);\n            SetIfMissing("rts.actionreplay.animation." + slug + ".easing", easing);\n        }\n    }\n\n    private void SetIfMissing(string key, object value)\n    {\n        var existing = CPH.GetGlobalVar<object>(key, true);\n        if (existing == null || string.IsNullOrWhiteSpace(existing.ToString())) CPH.SetGlobalVar(key, value, true);\n    }\n'''
          text = replace_once(text, old_positions, new_positions, 'settings position/animation block')

          old_preview = '''        CPH.SetArgument("replayAnimationDuration", GetSettingDouble("rts.actionreplay.animationDuration", 0.0));\n        CPH.SetArgument("replayAnimationEasing", CPH.GetGlobalVar<string>("rts.actionreplay.animationEasing", true) ?? "ease-in-out");'''
          new_preview = '''        CPH.SetArgument("replayAnimationDuration", GetAnimationProfileDouble("default", "duration", 500));\n        CPH.SetArgument("replayAnimationEasing", GetAnimationProfileString("default", "easing", "ease-in-out"));'''
          text = replace_once(text, old_preview, new_preview, 'settings preview animation')

          marker = '''    private double GetSettingDouble(string key, double fallback)\n'''
          helper = '''    private string GetAnimationProfileString(string slug, string field, string fallback)\n    {\n        var value = CPH.GetGlobalVar<string>("rts.actionreplay.animation." + slug + "." + field, true);\n        return string.IsNullOrWhiteSpace(value) ? fallback : value;\n    }\n\n    private double GetAnimationProfileDouble(string slug, string field, double fallback)\n    {\n        return GetSettingDouble("rts.actionreplay.animation." + slug + "." + field, fallback);\n    }\n\n'''
          text = replace_once(text, marker, helper + marker, 'settings profile helpers')
          write(path, text)

          # Playback action: normal Play Replay is the Playlist profile; manual movement/hide uses Default.
          path = 'streamerbot/RTSActionReplayPlayback.cs'
          text = read(path)
          text = replace_once(text, '        ApplyPlayerSettings(); CPH.TriggerEvent(EventName, true); SendMessage("play"); return true;', '        ApplyPlayerSettings("playlist"); CPH.TriggerEvent(EventName, true); SendMessage("play"); return true;', 'playback playlist profile')
          text = replace_once(text, 'public bool SetPlayerPosition() { if (!CPH.TryGetArg("rawInput", out string position) || string.IsNullOrWhiteSpace(position)) return false; ApplyPlayerSettings(); CPH.SetArgument("replayCommand", "move");', 'public bool SetPlayerPosition() { if (!CPH.TryGetArg("rawInput", out string position) || string.IsNullOrWhiteSpace(position)) return false; ApplyPlayerSettings("default"); CPH.SetArgument("replayCommand", "move");', 'playback move profile')
          text = replace_once(text, 'public bool HidePlayer() { ApplyPlayerSettings(); CPH.SetArgument("replayCommand", "hide");', 'public bool HidePlayer() { ApplyPlayerSettings("default"); CPH.SetArgument("replayCommand", "hide");', 'playback hide profile')
          text = replace_once(text, '    private void ApplyPlayerSettings()\n', '    private void ApplyPlayerSettings(string profile)\n', 'playback profile signature')
          old = '''        CPH.SetArgument("replayPositions", CPH.GetGlobalVar<string>("rts.actionreplay.positions", true) ?? "{\\"Full Screen\\":{\\"scale\\":100,\\"x\\":0,\\"y\\":0,\\"rotateX\\":0,\\"rotateY\\":0,\\"rotateZ\\":0}}"); CPH.SetArgument("replayStartPosition", CPH.GetGlobalVar<string>("rts.actionreplay.defaultStartPosition", true) ?? "Full Screen"); CPH.SetArgument("replayEndPosition", CPH.GetGlobalVar<string>("rts.actionreplay.defaultEndPosition", true) ?? "Full Screen");\n        CPH.SetArgument("replayAnimationDuration", GetSettingDouble("rts.actionreplay.animationDuration", .5)); CPH.SetArgument("replayAnimationEasing", CPH.GetGlobalVar<string>("rts.actionreplay.animationEasing", true) ?? "ease-in-out");'''
          new = '''        CPH.SetArgument("replayPositions", CPH.GetGlobalVar<string>("rts.actionreplay.positions", true) ?? "{\\"Full Screen\\":{\\"scale\\":100,\\"x\\":0,\\"y\\":0,\\"rotateX\\":0,\\"rotateY\\":0,\\"rotateZ\\":0}}"); CPH.SetArgument("replayStartPosition", GetAnimationProfileString(profile, "startPosition", "Full Screen")); CPH.SetArgument("replayEndPosition", GetAnimationProfileString(profile, "endPosition", "Full Screen"));\n        CPH.SetArgument("replayAnimationDuration", GetAnimationProfileDouble(profile, "duration", .5)); CPH.SetArgument("replayAnimationEasing", GetAnimationProfileString(profile, "easing", "ease-in-out"));'''
          text = replace_once(text, old, new, 'playback animation values')
          marker = '''    private void SendMessage(string type)\n'''
          helper = '''    private string GetAnimationProfileString(string profile, string field, string fallback)\n    {\n        var value = CPH.GetGlobalVar<string>("rts.actionreplay.animation." + profile + "." + field, true);\n        return string.IsNullOrWhiteSpace(value) ? fallback : value;\n    }\n\n    private double GetAnimationProfileDouble(string profile, string field, double fallback)\n    {\n        return GetSettingDouble("rts.actionreplay.animation." + profile + "." + field, fallback);\n    }\n\n'''
          text = replace_once(text, marker, helper + marker, 'playback profile helpers')
          write(path, text)

          # OBS auto-play: use OBS Clip profile.
          path = 'streamerbot/RTSActionReplayStore.cs'
          text = read(path)
          text = replace_once(text, '        CPH.SetArgument("replayStartPosition", CPH.GetGlobalVar<string>("rts.actionreplay.defaultStartPosition", true) ?? "Full Screen");\n        CPH.SetArgument("replayEndPosition", CPH.GetGlobalVar<string>("rts.actionreplay.defaultEndPosition", true) ?? "Full Screen");\n        CPH.SetArgument("replayAnimationDuration", GetSettingDouble("rts.actionreplay.animationDuration", .5));\n        CPH.SetArgument("replayAnimationEasing", CPH.GetGlobalVar<string>("rts.actionreplay.animationEasing", true) ?? "ease-in-out");', '        CPH.SetArgument("replayStartPosition", GetAnimationProfileString("obsClip", "startPosition", "Full Screen"));\n        CPH.SetArgument("replayEndPosition", GetAnimationProfileString("obsClip", "endPosition", "Full Screen"));\n        CPH.SetArgument("replayAnimationDuration", GetAnimationProfileDouble("obsClip", "duration", .5));\n        CPH.SetArgument("replayAnimationEasing", GetAnimationProfileString("obsClip", "easing", "ease-in-out"));', 'store animation values')
          marker = '''    private void BroadcastReplay(JObject replay)\n'''
          # Put helpers immediately before BroadcastReplay.
          helper = '''    private string GetAnimationProfileString(string profile, string field, string fallback)\n    {\n        var value = CPH.GetGlobalVar<string>("rts.actionreplay.animation." + profile + "." + field, true);\n        return string.IsNullOrWhiteSpace(value) ? fallback : value;\n    }\n\n    private double GetAnimationProfileDouble(string profile, string field, double fallback)\n    {\n        return GetSettingDouble("rts.actionreplay.animation." + profile + "." + field, fallback);\n    }\n\n'''
          text = replace_once(text, marker, helper + marker, 'store profile helpers')
          write(path, text)

          # Recent action: use Recent profile.
          path = 'streamerbot/RTSActionReplayRecent.cs'
          text = read(path)
          text = replace_once(text, '        ApplyPlayerSettings();\n        CPH.TriggerEvent(EventName, true);', '        ApplyPlayerSettings("recent");\n        CPH.TriggerEvent(EventName, true);', 'recent profile call')
          text = replace_once(text, '    private void ApplyPlayerSettings()\n', '    private void ApplyPlayerSettings(string profile)\n', 'recent profile signature')
          old = '''        CPH.SetArgument("replayStartPosition", CPH.GetGlobalVar<string>("rts.actionreplay.defaultStartPosition", true) ?? "Full Screen");\n        CPH.SetArgument("replayEndPosition", CPH.GetGlobalVar<string>("rts.actionreplay.defaultEndPosition", true) ?? "Full Screen");\n        CPH.SetArgument("replayAnimationDuration", GetDouble("rts.actionreplay.animationDuration", .5));\n        CPH.SetArgument("replayAnimationEasing", CPH.GetGlobalVar<string>("rts.actionreplay.animationEasing", true) ?? "ease-in-out");'''
          new = '''        CPH.SetArgument("replayStartPosition", GetAnimationProfileString(profile, "startPosition", "Full Screen"));\n        CPH.SetArgument("replayEndPosition", GetAnimationProfileString(profile, "endPosition", "Full Screen"));\n        CPH.SetArgument("replayAnimationDuration", GetDouble("rts.actionreplay.animation." + profile + ".duration", .5));\n        CPH.SetArgument("replayAnimationEasing", GetAnimationProfileString(profile, "easing", "ease-in-out"));'''
          text = replace_once(text, old, new, 'recent animation values')
          marker = '''    private JArray LoadRecentIds(JObject data)\n'''
          helper = '''    private string GetAnimationProfileString(string profile, string field, string fallback)\n    {\n        var value = CPH.GetGlobalVar<string>("rts.actionreplay.animation." + profile + "." + field, true);\n        return string.IsNullOrWhiteSpace(value) ? fallback : value;\n    }\n\n'''
          text = replace_once(text, marker, helper + marker, 'recent profile helper')
          write(path, text)

          # Twitch-created clip: use Twitch Clip profile in its dedicated broadcast path.
          path = 'streamerbot/RTSActionReplayTwitch.cs'
          text = read(path)
          old = '''        CPH.SetArgument("replayStartPosition", CPH.GetGlobalVar<string>("rts.actionreplay.defaultStartPosition", true) ?? "Full Screen");\n        CPH.SetArgument("replayEndPosition", CPH.GetGlobalVar<string>("rts.actionreplay.defaultEndPosition", true) ?? "Full Screen");\n        CPH.SetArgument("replayAnimationDuration", GetSettingDouble("rts.actionreplay.animationDuration", .5));\n        CPH.SetArgument("replayAnimationEasing", CPH.GetGlobalVar<string>("rts.actionreplay.animationEasing", true) ?? "ease-in-out");'''
          new = '''        CPH.SetArgument("replayStartPosition", GetAnimationProfileString("twitchClip", "startPosition", "Full Screen"));\n        CPH.SetArgument("replayEndPosition", GetAnimationProfileString("twitchClip", "endPosition", "Full Screen"));\n        CPH.SetArgument("replayAnimationDuration", GetAnimationProfileDouble("twitchClip", "duration", .5));\n        CPH.SetArgument("replayAnimationEasing", GetAnimationProfileString("twitchClip", "easing", "ease-in-out"));'''
          text = replace_once(text, old, new, 'twitch animation values')
          marker = '''    private string ResolvePlaybackUrl(JObject item, string mode)\n'''
          helper = '''    private string GetAnimationProfileString(string profile, string field, string fallback)\n    {\n        var value = CPH.GetGlobalVar<string>("rts.actionreplay.animation." + profile + "." + field, true);\n        return string.IsNullOrWhiteSpace(value) ? fallback : value;\n    }\n\n    private double GetAnimationProfileDouble(string profile, string field, double fallback)\n    {\n        return GetSettingDouble("rts.actionreplay.animation." + profile + "." + field, fallback);\n    }\n\n'''
          text = replace_once(text, marker, helper + marker, 'twitch profile helpers')
          write(path, text)

          print('Animation profile patch completed successfully.')
          PY

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamerbot/RTSActionReplaySettings.cs streamerbot/RTSActionReplayPlayback.cs streamerbot/RTSActionReplayStore.cs streamerbot/RTSActionReplayRecent.cs streamerbot/RTSActionReplayTwitch.cs .github/workflows/_apply-animation-profiles.yml
          git commit -m "Apply source-specific animation profiles [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
