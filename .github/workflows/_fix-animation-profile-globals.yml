name: Fix animation profile globals

on:
  push:
    branches: [catalog/twitch-integration]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix typed global reads
        shell: python
        run: |
          from pathlib import Path
          p = Path('streamerbot/RTSActionReplaySettings.cs')
          s = p.read_text(encoding='utf-8')
          old = '''    private void SetIfMissing(string key, object value)\n    {\n        var existing = CPH.GetGlobalVar<object>(key, true);\n        if (existing == null || string.IsNullOrWhiteSpace(existing.ToString())) CPH.SetGlobalVar(key, value, true);\n    }'''
          new = '''    private void SetIfMissing(string key, string value)\n    {\n        var existing = CPH.GetGlobalVar<string>(key, true);\n        if (string.IsNullOrWhiteSpace(existing)) CPH.SetGlobalVar(key, value, true);\n    }\n\n    private void SetIfMissing(string key, double value)\n    {\n        var existing = CPH.GetGlobalVar<double?>(key, true);\n        if (!existing.HasValue) CPH.SetGlobalVar(key, value, true);\n    }'''
          if old not in s:
              raise SystemExit('Expected SetIfMissing block not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add streamerbot/RTSActionReplaySettings.cs
          git diff --cached --quiet && exit 0
          git commit -m 'Fix animation profile global migration'
          git push